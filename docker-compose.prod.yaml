# 生产环境：前后端 + Postgres + MinIO，一键构建运行
# 部署: docker compose --env-file backend/.env -f docker-compose.prod.yaml up -d --build

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-postgres
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_knowledge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command: >
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=8MB
      -c maintenance_work_mem=32MB
      -c max_connections=30
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_knowledge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-net
    deploy:
      resources:
        limits:
          memory: 512M

  minio:
    image: minio/minio
    container_name: ai-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-admin123456}
      MINIO_API_REQUESTS_MAX: "100"
    command: server /data --quiet
    ports:
      - "9000:9000"
      # - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - ai-net
    deploy:
      resources:
        limits:
          memory: 384M

  backend:
    build:
      context: ./backend
    container_name: ai-backend
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    networks:
      - ai-net
    deploy:
      resources:
        limits:
          memory: 1536M

  frontend:
    build:
      context: ./frontend
      args:
        # 同域部署必须留空；勿设为 localhost:8000（会请求访问者本机）
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: ai-frontend
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ai-net
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  ai-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
