# 复制到 /etc/nginx/sites-available/ 后启用；bootstrap.sh 会替换 @DEPLOY_PATH@ 与 @DOMAIN@
server {
    listen 80;
    server_name @DOMAIN@;

    root @DEPLOY_PATH@/frontend/dist;
    index index.html;

    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI 路由（含 SSE 流式）
    location ~ ^/(auth|chat|conversations|knowledge-bases|documents|search|health|config|api|docs|redoc|openapi\.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
